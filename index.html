<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Daily Class Record Management System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono for spreadsheet clarity -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            navy: {
              50: '#F0F4F9',
              100: '#D9E2EC',
              200: '#BCCCDC',
              300: '#9FB3C8',
              400: '#829AB1',
              500: '#627D98',
              600: '#334E68',
              700: '#243B53',
              800: '#1A365D',
              900: '#0F2547',
              950: '#091830',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Google Sheets-inspired grid styling & smooth scrollbars */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }

    /* Spreadsheet Grid Cell Focus & Borders */
    .sheet-table {
      border-collapse: collapse;
      width: 100%;
    }
    .sheet-table th {
      background-color: #F1F5F9;
      color: #0F2547;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid #CBD5E1;
      padding: 0.6rem 0.75rem;
      user-select: none;
    }
    .sheet-table td {
      border: 1px solid #E2E8F0;
      padding: 0;
      vertical-align: middle;
      transition: background-color 0.12s ease;
    }
    .sheet-table tbody tr:hover td.row-index {
      background-color: #E2E8F0;
      color: #0F2547;
    }
    .sheet-cell-input {
      width: 100%;
      height: 100%;
      min-height: 38px;
      padding: 0.45rem 0.65rem;
      border: 2px solid transparent;
      background: transparent;
      font-size: 0.875rem;
      color: #0F172A;
      outline: none;
      transition: border-color 0.1s ease, background-color 0.1s ease;
    }
    .sheet-cell-input:focus {
      border-color: #1A365D;
      background-color: #FFFFFF;
      box-shadow: inset 0 0 0 1px #1A365D;
    }
    .sheet-cell-select {
      width: 100%;
      min-height: 38px;
      padding: 0.4rem 0.6rem;
      border: 2px solid transparent;
      font-size: 0.8125rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      border-radius: 0;
    }
    .sheet-cell-select:focus {
      border-color: #1A365D;
    }

    /* Status color coding */
    .status-blank { background-color: #FFFFFF; color: #64748B; font-weight: 400; }
    .status-present { background-color: #ECFDF5; color: #065F46; }
    .status-absent { background-color: #FEF2F2; color: #991B1B; }
    .status-noshow { background-color: #FFFBEB; color: #92400E; }
    .status-noclass { background-color: #F1F5F9; color: #64748B; }

    /* Full-row gray-out & edit lock when Class Status is "No Class" */
    tr.row-noclass,
    tr.row-noclass td,
    tr.row-noclass td.row-index,
    tr.row-noclass td input,
    tr.row-noclass td textarea,
    tr.row-noclass td select {
      background-color: #E2E8F0 !important;
      color: #64748B !important;
    }
    tr.row-noclass td input,
    tr.row-noclass td textarea {
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Sticky table header inside horizontal scroll container */
    .sheet-table thead th {
      position: sticky;
      top: 0;
      z-index: 15;
      background-color: #F1F5F9;
    }

    /* Multi-line editable notes inside spreadsheet cells */
    .sheet-cell-textarea {
      width: 100%;
      min-height: 40px;
      padding: 0.45rem 0.65rem;
      border: 2px solid transparent;
      background: transparent;
      font-size: 0.875rem;
      line-height: 1.35;
      color: #0F172A;
      outline: none;
      resize: vertical;
      display: block;
      transition: border-color 0.1s ease, background-color 0.1s ease;
    }
    .sheet-cell-textarea:focus {
      border-color: #1A365D;
      background-color: #FFFFFF;
      box-shadow: inset 0 0 0 1px #1A365D;
    }

    /* Google Sheets bottom tab bar style */
    .sheet-tab {
      border-top: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .sheet-tab.active {
      background-color: #FFFFFF;
      color: #0F2547;
      border-top: 3px solid #0F2547;
      font-weight: 600;
      box-shadow: 0 -2px 6px rgba(15, 37, 71, 0.06);
    /* Print optimization (A4 Landscape + Monthly Record & Summary Focus) */
    @page {
      size: A4 landscape;
      margin: 10mm;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #FFFFFF !important; font-size: 11px; }
      main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .sheet-table { min-width: 100% !important; }
      .sheet-table thead th { position: static !important; background-color: #E2E8F0 !important; color: #0F2547 !important; }
      .sheet-table th, .sheet-table td { border: 1px solid #94A3B8 !important; }
      .sheet-cell-input, .sheet-cell-textarea, .sheet-cell-select {
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
        min-height: auto !important;
        padding: 0.25rem 0.4rem !important;
        resize: none !important;
      }
      .sheet-cell-select {
        -webkit-appearance: none;
        appearance: none;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP APPLICATION NAVBAR -->
  <header class="bg-navy-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Brand / Title -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateToDashboard()">
        <div class="w-9 h-9 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center text-white shadow-inner">
          <i class="fa-solid fa-table-cells text-lg"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight leading-tight">Student Daily Class Record</h1>
          <p class="text-[11px] text-navy-200 hidden sm:block">ESL Academic &amp; Attendance Spreadsheet System</p>
        </div>
      </div>

      <!-- Right Utility Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <span id="saveStatusIndicator" class="hidden md:inline-flex items-center gap-1.5 text-xs text-navy-100 bg-navy-800/80 px-3 py-1.5 rounded-full border border-navy-700">
          <i class="fa-solid fa-cloud-check text-emerald-400"></i>
          <span>Changes saved successfully.</span>
        </span>
        <button onclick="exportAllBackupJSON()" title="Download JSON Backup of all students"
          class="text-xs font-medium bg-navy-800 hover:bg-navy-700 text-white px-3 py-2 rounded-lg border border-navy-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i>
          <span class="hidden sm:inline">Backup Data</span>
        </button>
        <button onclick="confirmResetDemoData()" title="Reset to sample ESL students"
          class="text-xs font-medium bg-navy-800 hover:bg-navy-700 text-navy-200 hover:text-white px-3 py-2 rounded-lg border border-navy-600 transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="hidden md:inline">Demo Data</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="appContainer" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none no-print"></div>

  <!-- MODAL BACKDROP & DIALOG CONTAINER -->
  <div id="modalBackdrop" class="fixed inset-0 bg-navy-950/60 backdrop-blur-xs z-40 hidden items-center justify-center p-4 no-print">
    <div id="modalContent" class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all">
      <!-- Dynamic Modal Body -->
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * STUDENT DAILY CLASS RECORD MANAGEMENT SYSTEM - CORE APPLICATION ENGINE
     * ============================================================================
     * Architecture:
     * - Single source of truth stored in `localStorage` under `esl_class_records_v1`.
     * - Full CRUD isolation per student (unique IDs, independent schedules, books,
     *   and monthly weekday record sheets).
     * - Automated calendar engine generating strictly Monday-Friday dates for
     *   any month/year (accounting for leap years) with blank status defaults.
     */

    const STORAGE_KEY = 'esl_class_records_v1';
    const MONTHS = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const STATUS_OPTIONS = [
      { value: '', label: '— Select Status —', className: 'status-blank' },
      { value: 'Present', label: 'Present', className: 'status-present' },
      { value: 'Absent', label: 'Absent', className: 'status-absent' },
      { value: 'No Show', label: 'No Show', className: 'status-noshow' },
      { value: 'No Class', label: 'No Class', className: 'status-noclass' }
    ];

    // Application State
    let appState = {
      students: [],
      view: 'dashboard', // 'dashboard' | 'profile'
      activeStudentId: null,
      activeProfileTab: 'records', // 'info' | 'schedule' | 'records'
      activeRecordKey: null, // e.g., '2026-11' (0-indexed month)
      searchQuery: '',
      editingInfo: false,
      editingSchedule: false,
      editingBookId: null,
      addingBook: false,
      hasUnsavedChanges: false
    };

    /**
     * Builds an independent 7-day (Monday-Sunday) schedule object.
     * Each weekday has its own scheduled toggle, startTime, endTime, and durationMins.
     */
    function createDefaultWeeklySchedule(customDays = {}) {
      const schedule = {};
      DAYS_OF_WEEK.forEach(day => {
        const override = customDays[day] || {};
        const enabled = Boolean(override.enabled);
        const startTime = enabled ? (override.startTime || '') : '';
        const endTime = enabled ? (override.endTime || '') : '';
        const durationMins = enabled ? calculateDurationMinutes(startTime, endTime) : null;
        schedule[day] = {
          scheduleId: generateUniqueId('SCH'),
          dayOfWeek: day,
          enabled,
          startTime,
          endTime,
          durationMins
        };
      });
      return schedule;
    }

    /**
     * Converts HH:MM (24h from time input) into total minutes from midnight.
     */
    function parseTimeToMinutes(timeStr) {
      if (!timeStr || typeof timeStr !== 'string' || !timeStr.includes(':')) return null;
      const [hStr, mStr] = timeStr.split(':');
      const hours = parseInt(hStr, 10);
      const mins = parseInt(mStr, 10);
      if (isNaN(hours) || isNaN(mins) || hours < 0 || hours > 23 || mins < 0 || mins > 59) return null;
      return hours * 60 + mins;
    }

    /**
     * Calculates class duration in minutes for same-day Start Time and End Time.
     * Returns null if either time is missing or endTime <= startTime.
     */
    function calculateDurationMinutes(startTime, endTime) {
      const startMins = parseTimeToMinutes(startTime);
      const endMins = parseTimeToMinutes(endTime);
      if (startMins === null || endMins === null) return null;
      if (endMins <= startMins) return null;
      return endMins - startMins;
    }

    /**
     * Normalizes legacy or partial schedule structures into a complete Mon-Sun map.
     */
    function normalizeStudentSchedule(rawSchedule) {
      const base = createDefaultWeeklySchedule();
      if (!rawSchedule || typeof rawSchedule !== 'object') return base;

      // Support legacy format if present
      if (Array.isArray(rawSchedule.days)) {
        rawSchedule.days.forEach(day => {
          if (base[day]) {
            base[day].enabled = true;
            base[day].startTime = rawSchedule.time || '';
            base[day].endTime = '';
            base[day].durationMins = null;
          }
        });
        return base;
      }

      DAYS_OF_WEEK.forEach(day => {
        if (rawSchedule[day]) {
          const entry = rawSchedule[day];
          const enabled = Boolean(entry.enabled);
          const startTime = enabled ? (entry.startTime || '') : '';
          const endTime = enabled ? (entry.endTime || '') : '';
          const durationMins = enabled
            ? (typeof entry.durationMins === 'number' ? entry.durationMins : calculateDurationMinutes(startTime, endTime))
            : null;
          base[day] = {
            scheduleId: entry.scheduleId || base[day].scheduleId,
            dayOfWeek: day,
            enabled,
            startTime,
            endTime,
            durationMins
          };
        }
      });
      return base;
    }

    /**
     * Formats per-day weekly schedule into a compact multi-line summary for student cards.
     * Example: Monday – 7:00 PM; Wednesday – 8:00 PM; Friday – 7:30 PM
     */
    function formatPerDayScheduleSummary(scheduleMap) {
      const normalized = normalizeStudentSchedule(scheduleMap);
      const activeEntries = DAYS_OF_WEEK
        .map(day => normalized[day])
        .filter(item => item && item.enabled);

      if (activeEntries.length === 0) {
        return ['No weekly classes scheduled'];
      }

      return activeEntries.map(item => {
        const startLabel = item.startTime ? formatTime12Hour(item.startTime) : 'Time TBD';
        const endLabel = item.endTime ? `–${formatTime12Hour(item.endTime)}` : '';
        const durLabel = typeof item.durationMins === 'number' ? ` (${item.durationMins} min)` : '';
        return `${item.dayOfWeek} – ${startLabel}${endLabel}${durLabel}`;
      });
    }

    // ============================================================================
    // 1. INITIALIZATION & DEMO DATA SEEDING
    // ============================================================================
    function generateUniqueId(prefix = 'STU') {
      const rand = Math.floor(1000 + Math.random() * 9000);
      const stamp = Date.now().toString().slice(-3);
      return `${prefix}-${rand}${stamp}`;
    }

    /**
     * Generates strictly Monday–Friday dates for a given year and month (0-11).
     * Accurately handles month lengths and leap years via native Date objects.
     * Leaves Page Number, Lesson, Notes, and Class Status completely blank.
     */
    function generateWeekdaysForMonth(year, monthIndex) {
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const shortMonth = MONTHS[monthIndex].slice(0, 3);
      const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const rows = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, monthIndex, day);
        const dayOfWeek = dateObj.getDay(); // 0 = Sun, 1 = Mon ... 5 = Fri, 6 = Sat
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          const isoDate = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const formattedDate = `${shortMonth} ${day}, ${year}`;
          const dayLabel = dayNamesShort[dayOfWeek];
          rows.push({
            id: `ROW-${isoDate}`,
            isoDate,
            formattedDate,
            dayLabel,
            pageNumber: '',
            lesson: '',
            notes: '',
            status: '' // Strictly blank on generation
          });
        }
      }
      return rows;
    }

    function createSeedData() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const recordKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

      // Sample Student 1
      const sampleRows1 = generateWeekdaysForMonth(currentYear, currentMonth);
      if (sampleRows1.length >= 3) {
        sampleRows1[0].pageNumber = '14–16';
        sampleRows1[0].lesson = 'Unit 3: Business Introductions & Small Talk';
        sampleRows1[0].notes = 'Great pronunciation on polite greetings. Homework: p. 17 ex. B';
        sampleRows1[0].status = 'Present';

        sampleRows1[1].pageNumber = '17–19';
        sampleRows1[1].lesson = 'Unit 3: Describing Job Responsibilities';
        sampleRows1[1].notes = 'Practiced present simple vs. present continuous.';
        sampleRows1[1].status = 'Present';

        sampleRows1[2].pageNumber = '';
        sampleRows1[2].lesson = 'Unit 4: Scheduling Meetings';
        sampleRows1[2].notes = 'Student notified 2 hours prior due to work travel.';
        sampleRows1[2].status = 'Absent';
      }

      // Sample Student 2
      const sampleRows2 = generateWeekdaysForMonth(currentYear, currentMonth);
      if (sampleRows2.length >= 2) {
        sampleRows2[0].pageNumber = '42';
        sampleRows2[0].lesson = 'Chapter 6: Past Tense Irregular Verbs';
        sampleRows2[0].notes = 'Completed storytelling activity with 90% accuracy.';
        sampleRows2[0].status = 'Present';

        sampleRows2[1].pageNumber = '43–44';
        sampleRows2[1].lesson = 'Chapter 6: Travel & Airport Vocabulary';
        sampleRows2[1].notes = 'Roleplay check-in conversation.';
        sampleRows2[1].status = 'Present';
      }

      return [
        {
          id: 'STU-1042',
          name: 'Hana Takahashi',
          info: 'Level: Intermediate (B1) • Adult Professional • Tokyo, Japan',
          notes: 'Preparing for overseas project assignment. Prefers conversational roleplay and gentle grammar correction.',
          schedule: createDefaultWeeklySchedule({
            Monday: { enabled: true, startTime: '19:00', endTime: '19:25' },
            Wednesday: { enabled: true, startTime: '20:00', endTime: '20:25' },
            Friday: { enabled: true, startTime: '19:30', endTime: '20:00' }
          }),
          books: [
            {
              id: 'BK-201',
              title: 'Business Result Intermediate',
              level: 'B1 Intermediate',
              unit: 'Unit 4: Scheduling & Arrangements',
              currentPage: '20',
              notes: 'Focus on listening tracks and email writing.'
            },
            {
              id: 'BK-202',
              title: 'English Grammar in Use (Murphy)',
              level: 'Intermediate',
              unit: 'Unit 19: Future Tenses',
              currentPage: '38',
              notes: 'Used as supplementary homework reference.'
            }
          ],
          records: {
            [recordKey]: {
              key: recordKey,
              year: currentYear,
              monthIndex: currentMonth,
              monthName: MONTHS[currentMonth],
              rows: sampleRows1
            }
          }
        },
        {
          id: 'STU-1089',
          name: 'Min-jun Park',
          info: 'Level: Pre-Intermediate (A2+) • University Student • Seoul, South Korea',
          notes: 'Building speaking fluency and IELTS foundation vocabulary.',
          schedule: createDefaultWeeklySchedule({
            Tuesday: { enabled: true, startTime: '18:30', endTime: '18:55' },
            Thursday: { enabled: true, startTime: '20:00', endTime: '20:30' },
            Sunday: { enabled: true, startTime: '09:00', endTime: '09:25' }
          }),
          books: [
            {
              id: 'BK-305',
              title: 'Speakout 2nd Edition Pre-Intermediate',
              level: 'A2+ Pre-Intermediate',
              unit: 'Chapter 6: Journeys',
              currentPage: '45',
              notes: 'Great engagement with video podcasts.'
            }
          ],
          records: {
            [recordKey]: {
              key: recordKey,
              year: currentYear,
              monthIndex: currentMonth,
              monthName: MONTHS[currentMonth],
              rows: sampleRows2
            }
          }
        }
      ];
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            appState.students = parsed.map(st => ({
              ...st,
              schedule: normalizeStudentSchedule(st.schedule),
              books: Array.isArray(st.books) ? st.books : [],
              records: st.records && typeof st.records === 'object' ? st.records : {}
            }));
            appState.hasUnsavedChanges = false;
            return;
          }
        }
      } catch (err) {
        console.error('Error loading records from localStorage:', err);
        showToast('Could not read saved browser records; using initial sample data.', 'error');
      }
      // Initial state when localStorage is empty
      appState.students = createSeedData();
      saveData(false, 'Changes saved successfully.');
    }

    function saveData(showIndicator = true, customMessage = 'Changes saved successfully.') {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.students));
        appState.hasUnsavedChanges = false;
        if (showIndicator) {
          triggerSavedIndicator(customMessage);
        }
        return true;
      } catch (err) {
        console.error('Failed to save data:', err);
        appState.hasUnsavedChanges = true;
        triggerUnsavedIndicator('Save error — changes not stored');
        showToast('Error saving data to browser storage. Please export a JSON backup.', 'error');
        return false;
      }
    }

    function markUnsavedChanges(label = 'Unsaved changes') {
      appState.hasUnsavedChanges = true;
      triggerUnsavedIndicator(label);
    }

    function triggerUnsavedIndicator(label = 'Unsaved changes') {
      const el = document.getElementById('saveStatusIndicator');
      if (!el) return;
      el.className = 'hidden md:inline-flex items-center gap-1.5 text-xs text-amber-200 bg-amber-900/70 px-3 py-1.5 rounded-full border border-amber-500/60';
      el.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-300"></i><span>${escapeHTML(label)}</span>`;
    }

    function triggerSavedIndicator(message = 'Changes saved successfully.') {
      const el = document.getElementById('saveStatusIndicator');
      if (!el) return;
      el.className = 'hidden md:inline-flex items-center gap-1.5 text-xs text-navy-100 bg-navy-800/80 px-3 py-1.5 rounded-full border border-navy-700';
      el.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-400"></i><span>${escapeHTML(message)}</span>`;
    }

    // Warn on browser refresh/close if there are pending unsaved edits
    window.addEventListener('beforeunload', (e) => {
      if (appState.hasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // ============================================================================
    // 2. HELPER UTILITIES & COMPUTATIONS
    // ============================================================================
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getActiveStudent() {
      return appState.students.find(s => s.id === appState.activeStudentId) || null;
    }

    function computeStudentStats(student) {
      let present = 0;
      let absent = 0;
      let noShow = 0;
      let noClass = 0;
      let latestRecord = null;

      const recordKeys = Object.keys(student.records || {}).sort();
      recordKeys.forEach(key => {
        const sheet = student.records[key];
        (sheet.rows || []).forEach(row => {
          if (row.status === 'Present') present++;
          else if (row.status === 'Absent') absent++;
          else if (row.status === 'No Show') noShow++;
          else if (row.status === 'No Class') noClass++;

          if (row.status || row.lesson || row.pageNumber) {
            latestRecord = {
              date: row.formattedDate,
              lesson: row.lesson,
              status: row.status
            };
          }
        });
      });

      return { present, absent, noShow, noClass, latestRecord };
    }

    function formatScheduleSummary(schedule) {
      const lines = formatPerDayScheduleSummary(schedule);
      return lines.join(' • ');
    }

    function formatTime12Hour(time24) {
      if (!time24 || !time24.includes(':')) return time24;
      const [hStr, mStr] = time24.split(':');
      let h = parseInt(hStr, 10);
      if (isNaN(h)) return time24;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${mStr} ${ampm}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgClass = type === 'error'
        ? 'bg-red-800 border-red-600 text-white'
        : type === 'info'
        ? 'bg-navy-800 border-navy-600 text-white'
        : 'bg-navy-900 border-navy-700 text-white';

      const icon = type === 'error'
        ? '<i class="fa-solid fa-circle-exclamation text-red-300"></i>'
        : '<i class="fa-solid fa-circle-check text-emerald-400"></i>';

      toast.className = `${bgClass} border px-4 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center gap-2.5 transform transition-all duration-200 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `${icon}<span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 220);
      }, 3000);
    }

    function handleScheduleDayToggle(day, isChecked) {
      markUnsavedChanges('Unsaved schedule edits');
      const startEl = document.getElementById(`schedStart-${day}`);
      const endEl = document.getElementById(`schedEnd-${day}`);
      const durEl = document.getElementById(`schedDur-${day}`);
      const rowEl = document.getElementById(`schedRow-${day}`);

      if (startEl) startEl.disabled = !isChecked;
      if (endEl) endEl.disabled = !isChecked;

      if (!isChecked) {
        if (startEl) startEl.value = '';
        if (endEl) endEl.value = '';
        if (durEl) {
          durEl.textContent = 'No Class';
          durEl.className = 'py-2.5 px-3 text-right font-mono font-semibold text-slate-400';
        }
        if (rowEl) rowEl.className = 'bg-slate-50/80 text-slate-400';
        hideScheduleValidationBanner();
      } else {
        if (rowEl) rowEl.className = 'bg-white';
        handleScheduleTimeChange(day);
      }
    }

    function handleScheduleTimeChange(day) {
      markUnsavedChanges('Unsaved schedule edits');
      const startEl = document.getElementById(`schedStart-${day}`);
      const endEl = document.getElementById(`schedEnd-${day}`);
      const durEl = document.getElementById(`schedDur-${day}`);
      if (!startEl || !endEl || !durEl) return;

      const startVal = startEl.value;
      const endVal = endEl.value;
      const startMins = parseTimeToMinutes(startVal);
      const endMins = parseTimeToMinutes(endVal);

      if (startMins !== null && endMins !== null && endMins <= startMins) {
        durEl.textContent = 'Invalid';
        durEl.className = 'py-2.5 px-3 text-right font-mono font-semibold text-red-600';
        showScheduleValidationBanner(`${day}: End Time must be later than Start Time for same-day classes.`);
        return;
      }

      hideScheduleValidationBanner();
      const duration = calculateDurationMinutes(startVal, endVal);
      if (typeof duration === 'number') {
        durEl.textContent = `${duration} min`;
        durEl.className = 'py-2.5 px-3 text-right font-mono font-semibold text-navy-900';
      } else {
        durEl.textContent = '—';
        durEl.className = 'py-2.5 px-3 text-right font-mono font-semibold text-slate-400';
      }
    }

    function showScheduleValidationBanner(msg) {
      const banner = document.getElementById('scheduleValidationBanner');
      if (!banner) return;
      banner.textContent = msg;
      banner.classList.remove('hidden');

    function saveStudentSchedule(event) {
      event.preventDefault();
      const student = getActiveStudent();
      if (!student) return;

      const currentMap = normalizeStudentSchedule(student.schedule);
      const updatedMap = {};

      for (const day of DAYS_OF_WEEK) {
        const isChecked = Boolean(document.getElementById(`schedCheck-${day}`)?.checked);
        const startTime = isChecked ? (document.getElementById(`schedStart-${day}`)?.value || '') : '';
        const endTime = isChecked ? (document.getElementById(`schedEnd-${day}`)?.value || '') : '';

        if (isChecked && startTime && endTime) {
          const sMins = parseTimeToMinutes(startTime);
          const eMins = parseTimeToMinutes(endTime);
          if (sMins !== null && eMins !== null && eMins <= sMins) {
            showScheduleValidationBanner(`${day}: End Time cannot be earlier than or equal to Start Time.`);
            showToast(`Invalid time range on ${day}.`, 'error');
            return;
          }
        }

        const durationMins = isChecked ? calculateDurationMinutes(startTime, endTime) : null;
        updatedMap[day] = {
          scheduleId: currentMap[day]?.scheduleId || generateUniqueId('SCH'),
          dayOfWeek: day,
          enabled: isChecked,
          startTime,
          endTime,
          durationMins
        };
      }

      student.schedule = updatedMap;
      appState.editingSchedule = false;
      saveData(true, 'Changes saved successfully.');
      showToast('Changes saved successfully.');
      render();
    }

    function computeMonthlySummary(sheet) {
      const rows = (sheet && Array.isArray(sheet.rows)) ? sheet.rows : [];
      const totalScheduledDays = rows.length;
      let presentCount = 0;
      let absentCount = 0;
      let noShowCount = 0;
      let noClassCount = 0;
      let unmarkedCount = 0;

      rows.forEach(r => {
        if (r.status === 'Present') presentCount++;
        else if (r.status === 'Absent') absentCount++;
        else if (r.status === 'No Show') noShowCount++;
        else if (r.status === 'No Class') noClassCount++;
        else unmarkedCount++;
      });

      const applicableDays = totalScheduledDays - noClassCount;
      const completionRate = applicableDays > 0
        ? Math.round((presentCount / applicableDays) * 100)
        : 0;

      return {
        totalScheduledDays,
        presentCount,
        absentCount,
        noShowCount,
        noClassCount,
        unmarkedCount,
        applicableDays,
        completionRate
      };
    }

    function renderDailyRecordsTab(student) {

      const activeSheet = appState.activeRecordKey ? student.records[appState.activeRecordKey] : null;
      const now = new Date();
      const defaultMonth = now.getMonth();
      const defaultYear = now.getFullYear();

      const summary = computeMonthlySummary(activeSheet);

      return `
        <!-- MONTH & YEAR GENERATOR + SHEET CONTROLS TOOLBAR -->
        <div class="bg-white rounded-t-xl border border-slate-200 p-4 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 no-print">

    function handleAddMonthlyRecord() {
      const student = getActiveStudent();
      if (!student) return;

      const monthSelect = document.getElementById('selectNewMonth');
      const yearSelect = document.getElementById('selectNewYear');
      const monthIndex = monthSelect ? parseInt(monthSelect.value, 10) : new Date().getMonth();
      const year = yearSelect ? parseInt(yearSelect.value, 10) : new Date().getFullYear();

      if (isNaN(monthIndex) || monthIndex < 0 || monthIndex > 11 || isNaN(year) || year < 1900 || year > 2100) {
        showToast('Please select a valid month and year.', 'error');
        return;
      }

      const key = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
      if (!student.records) student.records = {};

      // Prevent duplicate monthly records for the same student
      if (student.records[key]) {
        appState.activeRecordKey = key;
        showToast(`${MONTHS[monthIndex]} ${year} already exists for ${student.name}. Switched to existing sheet.`, 'info');
        render();
        return;
      }

      const generatedRows = generateWeekdaysForMonth(year, monthIndex);
      student.records[key] = {
        key,
        year,
        monthIndex,
        monthName: MONTHS[monthIndex],
        rows: generatedRows
      };

      appState.activeRecordKey = key;
      saveData(true, 'Changes saved successfully.');
      showToast(`Generated ${generatedRows.length} weekday rows for ${MONTHS[monthIndex]} ${year}.`);
      render();
    }

    function switchMonthlySheet(key) {
      guardedAction(() => {
        appState.activeRecordKey = key;
        render();
      });
    }

    function syncVisibleGridInputsToSheet(sheetKey) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const rows = student.records[sheetKey].rows || [];

      rows.forEach((row, idx) => {
        const pageEl = document.querySelector(`[data-row="${idx}"][data-col="0"]`);
        const lessonEl = document.querySelector(`[data-row="${idx}"][data-col="1"]`);
        const notesEl = document.querySelector(`[data-row="${idx}"][data-col="2"]`);
        const statusEl = document.querySelector(`[data-row="${idx}"][data-col="3"]`);

        if (pageEl && !pageEl.disabled) row.pageNumber = pageEl.value;
        if (lessonEl && !lessonEl.disabled) row.lesson = lessonEl.value;
        if (notesEl && !notesEl.disabled) row.notes = notesEl.value;
        if (statusEl) row.status = statusEl.value;
      });
    }

    function saveDailyRecordSheetManual() {
      const student = getActiveStudent();
      if (!student || !appState.activeRecordKey || !student.records[appState.activeRecordKey]) return;
      syncVisibleGridInputsToSheet(appState.activeRecordKey);
      const ok = saveData(true, 'Changes saved successfully.');
      if (ok) {
        showToast('Changes saved successfully.');
        render();
      }
    }

    function updateDailyRecordCell(sheetKey, rowIndex, field, value) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const row = student.records[sheetKey].rows[rowIndex];
      if (!row || row.status === 'No Class') return;

      row[field] = value;
      saveData(true, 'Changes saved successfully.');
    }

    function updateDailyRecordStatus(sheetKey, rowIndex, selectEl) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const row = student.records[sheetKey].rows[rowIndex];
      if (!row) return;

      row.status = selectEl.value;
      saveData(true, 'Changes saved successfully.');
      render();
    }

    function confirmClearMonthlyRecord(sheetKey) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const sheet = student.records[sheetKey];

      openModal(`
        <div class="bg-amber-700 text-white px-6 py-4 flex items-center justify-between">
          <h3 class="text-base font-bold">Clear Monthly Class Record</h3>
          <button onclick="closeModal()" class="text-amber-100 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-sm text-slate-700">
            Clear all entered Page Numbers, Lessons, Notes, and Class Statuses for <strong>${escapeHTML(sheet.monthName)} ${sheet.year}</strong>?
            The Monday–Friday dates will remain generated with blank statuses.
          </p>
          <div class="flex justify-end gap-2.5 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">Cancel</button>
            <button onclick="executeClearMonthlyRecord('${sheetKey}')" class="px-4 py-2 text-sm font-semibold bg-amber-700 hover:bg-amber-800 text-white rounded-lg">Clear Record</button>
          </div>
        </div>
      `);
    }

    function executeClearMonthlyRecord(sheetKey) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const sheet = student.records[sheetKey];
      sheet.rows = generateWeekdaysForMonth(sheet.year, sheet.monthIndex);
      saveData(true, 'Changes saved successfully.');
      closeModal();
      showToast(`Cleared ${sheet.monthName} ${sheet.year} entries.`);
      render();
    }

    }

    function updateDailyRecordCell(sheetKey, rowIndex, field, value) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const row = student.records[sheetKey].rows[rowIndex];
      if (!row) return;

      row[field] = value;
      saveData();
    }

    function updateDailyRecordStatus(sheetKey, rowIndex, selectEl) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const row = student.records[sheetKey].rows[rowIndex];
      if (!row) return;

      row.status = selectEl.value;
      saveData();
      // Re-render to immediately update status pill colors & summary counters
      render();
    }

    // Keyboard navigation (Enter moves down to same column in next row, like Google Sheets)
    function handleGridKeyNav(event, rowIndex, colIndex) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const nextInput = document.querySelector(`[data-row="${rowIndex + 1}"][data-col="${colIndex}"]`);
        if (nextInput) {
          nextInput.focus();
          if (nextInput.select) nextInput.select();
        }
      }
    }

    function confirmDeleteMonthlySheet(sheetKey) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      const sheet = student.records[sheetKey];

      openModal(`
        <div class="bg-red-700 text-white px-6 py-4 flex items-center justify-between">
          <h3 class="text-base font-bold">Delete Monthly Sheet</h3>
          <button onclick="closeModal()" class="text-red-200 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-sm text-slate-700">
            Delete the entire <strong>${escapeHTML(sheet.monthName)} ${sheet.year}</strong> class record sheet for <strong>${escapeHTML(student.name)}</strong>?
          </p>
          <div class="flex justify-end gap-2.5 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">Cancel</button>
            <button onclick="executeDeleteMonthlySheet('${sheetKey}')" class="px-4 py-2 text-sm font-semibold bg-red-600 hover:bg-red-700 text-white rounded-lg">Delete Sheet</button>
          </div>
        </div>
      `);
    }

    function executeDeleteMonthlySheet(sheetKey) {
      const student = getActiveStudent();
      if (!student || !student.records[sheetKey]) return;
      delete student.records[sheetKey];
      const remaining = Object.keys(student.records).sort();
      appState.activeRecordKey = remaining.length > 0 ? remaining[remaining.length - 1] : null;
      saveData();
      closeModal();
      showToast('Monthly sheet deleted.');
      render();
    }

    // ============================================================================
    // 7. EXPORT & BACKUP UTILITIES
    // ============================================================================
    function exportCurrentSheetCSV() {
      const student = getActiveStudent();
      if (!student || !appState.activeRecordKey || !student.records[appState.activeRecordKey]) return;
      const sheet = student.records[appState.activeRecordKey];

      const csvEscape = (val) => `"${String(val || '').replace(/"/g, '""')}"`;
      const lines = [
        [`Student Name`, student.name, `Student ID`, student.id].map(csvEscape).join(','),
        [`Month`, `${sheet.monthName} ${sheet.year}`].map(csvEscape).join(','),
        '',
        ['Date', 'Day', 'Page Number', 'Lesson', 'Notes', 'Class Status'].map(csvEscape).join(',')
      ];

      sheet.rows.forEach(r => {
        lines.push([
          r.formattedDate,
          r.dayLabel,
          r.pageNumber,
          r.lesson,
          r.notes,
          r.status
        ].map(csvEscape).join(','));
      });

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${student.name.replace(/\s+/g, '_')}_${sheet.monthName}_${sheet.year}_Record.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Exported ${sheet.monthName} ${sheet.year} CSV.`);
    }

    function exportAllBackupJSON() {
      const blob = new Blob([JSON.stringify(appState.students, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ESL_Student_Records_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Downloaded full JSON backup.');
    }

    function confirmResetDemoData() {
      openModal(`
        <div class="bg-navy-900 text-white px-6 py-4 flex items-center justify-between">
          <h3 class="text-base font-bold">Restore Sample ESL Demo Data</h3>
          <button onclick="closeModal()" class="text-navy-200 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-sm text-slate-700">
            This will replace current local data with two sample ESL students, schedules, books, and current month class records.
          </p>
          <div class="flex justify-end gap-2.5 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">Cancel</button>
            <button onclick="executeResetDemoData()" class="px-4 py-2 text-sm font-semibold bg-navy-900 hover:bg-navy-800 text-white rounded-lg">Restore Demo Data</button>
          </div>
        </div>
      `);
    }

    function executeResetDemoData() {
      appState.students = createSeedData();
      saveData();
      closeModal();
      navigateToDashboard();
      showToast('Sample ESL student records restored.');
    }

    // ============================================================================
    // 8. MAIN RENDER LOOP
    // ============================================================================
    function render() {
      const container = document.getElementById('appContainer');
      if (!container) return;

      if (appState.view === 'profile' && appState.activeStudentId) {
        container.innerHTML = renderStudentProfile();
      } else {
        container.innerHTML = renderDashboard();
      }
    }

    // Boot Application on Window Load
    window.onload = function () {
      loadData();
      render();
    };
  </script>
</body>
</html>
